<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 검색엔진 수집·보관·미리보기 금지 -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
<meta name="googlebot" content="noindex, nofollow, noarchive">
<meta name="Yeti" content="noindex, nofollow">
<meta name="bingbot" content="noindex, nofollow">
<title>확인설명서 조회</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#dde1e6;--text:#1f2328;--muted:#667085;--accent:#3b6fd8;--accent-bg:#eef3fb;--warn-bg:#fff4e5;--warn-line:#f0c48a;--need:#b26a00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:15px}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:20px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
form.search{display:grid;grid-template-columns:1fr 90px 90px auto;gap:8px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit}
button{padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.keys label{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
.keys input{margin-top:4px}
#status{color:var(--muted);font-size:14px;min-height:20px;margin:4px 2px 10px}
h2{font-size:16px;margin:22px 0 8px;padding:7px 10px;background:var(--accent-bg);border-left:4px solid var(--accent);border-radius:4px}
.title{font-size:18px;font-weight:700;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;background:var(--card)}
th,td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left;font-size:14px}
th{width:170px;background:#fafafa;font-weight:600}
.v{font-weight:600}
.need{color:var(--need)}
td button{margin-left:8px;font-size:12px;padding:2px 8px}
.note{color:var(--muted);font-size:12px;margin-top:3px}
.warn{background:var(--warn-bg);border:1px solid var(--warn-line);padding:9px 12px;border-radius:8px;font-size:13px;margin:10px 0}
a{color:var(--accent)}
@media (max-width:640px){
  form.search{grid-template-columns:1fr 1fr}
  form.search #addr{grid-column:1/-1}
  form.search button{grid-column:1/-1}
  th{width:105px}
}
@media print{header,.card.input,#keys{display:none}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>확인설명서 조회</h1>
    <button id="btnKeys" type="button">인증키 설정</button>
  </header>

  <div class="card keys" id="keys" hidden>
    <label>공공데이터포털 인증키 (Encoding 키)<input id="kData" autocomplete="off" spellcheck="false"></label>
    <label>브이월드 인증키<input id="kVw" autocomplete="off" spellcheck="false"></label>
    <label>카카오 REST API 키 (선택, 학교·지하철역 검색이 더 정확해짐)<input id="kKakao" autocomplete="off" spellcheck="false"></label>
    <p class="note">키는 이 브라우저에만 저장됩니다. 페이지 파일이나 GitHub에는 올라가지 않습니다.</p>
    <button class="primary" id="saveKeys" type="button">저장</button>
  </div>

  <div class="card input">
    <form class="search" id="f">
      <input id="addr" placeholder="주소 (예: 서대문구 대현동 37-32 617호)" required>
      <input id="dong" placeholder="동">
      <input id="ho" placeholder="호">
      <button class="primary" type="submit">조회</button>
    </form>
  </div>

  <div id="status"></div>
  <div id="out"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
let KEYS = {};
function loadKeys() {
  KEYS = { data: store.get('gs_data'), vw: store.get('gs_vw'), kakao: store.get('gs_kakao') };
  $('kData').value = KEYS.data; $('kVw').value = KEYS.vw; $('kKakao').value = KEYS.kakao;
  if (!KEYS.data || !KEYS.vw) $('keys').hidden = false;
}
$('btnKeys').onclick = () => { $('keys').hidden = !$('keys').hidden; };
$('saveKeys').onclick = () => {
  store.set('gs_data', $('kData').value.trim());
  store.set('gs_vw', $('kVw').value.trim());
  store.set('gs_kakao', $('kKakao').value.trim());
  loadKeys();
  $('keys').hidden = true;
  setStatus('인증키를 저장했습니다.');
};

// ---------- 공통 ----------
const sleep = ms => new Promise(r => setTimeout(r, ms));
const enc = encodeURIComponent;
const arr = x => (x == null || x === '') ? [] : (Array.isArray(x) ? x : [x]);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const normDong = s => String(s || '').trim().replace(/동$/, '');
const setStatus = t => { $('status').textContent = t; };
// Decoding 키를 붙여넣어도 동작하도록 % 가 없으면 인코딩한다
const dataKey = () => KEYS.data.includes('%') ? KEYS.data : enc(KEYS.data);

async function getJson(url, headers) {
  for (let i = 0; i < 4; i++) {
    try {
      const r = await fetch(url, { headers });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (e) {
      if (i === 3) throw e;
      await sleep(1500);
    }
  }
}
// 브이월드는 브라우저 직접 호출(CORS)을 막아서 JSONP로 부른다
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = '_vw' + Date.now() + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const done = () => { delete window[cb]; s.remove(); };
    const tm = setTimeout(() => { window[cb] = () => {}; s.remove(); reject(new Error('timeout')); }, 12000);
    window[cb] = d => { clearTimeout(tm); done(); resolve(d); };
    s.onerror = () => { clearTimeout(tm); done(); reject(new Error('load error')); };
    s.src = url + '&callback=' + cb;
    document.head.appendChild(s);
  });
}
async function vwSearch(params) {
  for (let i = 0; i < 3; i++) {
    try {
      return await jsonp(`https://api.vworld.kr/req/search?service=search&request=search&version=2.0&crs=EPSG:4326&format=json&key=${KEYS.vw}&${params}`);
    } catch (e) {
      if (i === 2) throw e;
      await sleep(1000);
    }
  }
}
function distance(x1, y1, x2, y2) {
  const R = 6371000, rad = Math.PI / 180;
  const p1 = y1 * rad, p2 = y2 * rad, dp = (y2 - y1) * rad, dl = (x2 - x1) * rad;
  const a = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
// 직선거리 x1.3 을 실제 길 거리로 보고 도보 67m/분, 차량 약 18km/h(신호 포함)로 계산
const walk = d => Math.max(1, Math.ceil(d * 1.3 / 67));
const car = d => Math.max(1, Math.ceil(d * 1.3 / 300));
const trip = d => walk(d) <= 20 ? `도보 약 ${walk(d)}분` : `차량 약 ${car(d)}분 (도보 ${walk(d)}분)`;

// ---------- 조회 ----------
async function lookup(addrIn, dongIn, hoIn) {
  let ho = hoIn, dong = dongIn;
  let m;
  if (!ho && (m = addrIn.match(/(\d{2,5})\s*호/))) ho = m[1];
  if (!dong && (m = addrIn.match(/(\d{1,4}|[A-Za-z가-힣])동\s*\d{2,5}\s*호/))) dong = m[1];
  ho = String(ho || '').replace(/호$/, '').trim();
  dong = normDong(dong);
  let query = addrIn.replace(/번지/g, '');
  if ((m = query.match(/^(.*?(?:동|리|가|로|길)\s*(?:산\s*)?\d+(?:-\d+)?)/))) query = m[1];

  // 1. 주소 -> 지번코드(PNU), 좌표
  setStatus('주소 확인 중…');
  let hit = null;
  for (const cat of ['parcel', 'road']) {
    const r = await vwSearch(`size=5&page=1&query=${enc(query)}&type=address&category=${cat}`);
    if (r.response?.status === 'OK') { hit = arr(r.response.result.items)[0]; break; }
  }
  if (!hit) throw new Error(`주소를 찾지 못했습니다: ${query}`);
  const x = +hit.point.x, y = +hit.point.y;
  let pnu = String(hit.id);
  if (!/^\d{19}$/.test(pnu) && hit.address?.parcel) {
    // 도로명으로 찾은 경우 지번 주소로 다시 검색해 PNU를 얻는다
    const r = await vwSearch(`size=5&page=1&query=${enc(hit.address.parcel)}&type=address&category=parcel`);
    if (r.response?.status === 'OK') pnu = String(arr(r.response.result.items)[0].id);
  }
  if (!/^\d{19}$/.test(pnu)) throw new Error('지번 코드를 찾지 못했습니다. 지번 주소로 다시 넣어 주세요.');
  const parcelAddr = hit.address?.parcel || query;
  const roadAddr = hit.address?.road || '';
  const B = `sigunguCd=${pnu.slice(0, 5)}&bjdongCd=${pnu.slice(5, 10)}&platGbCd=${pnu[10] === '2' ? '1' : '0'}&bun=${pnu.slice(11, 15)}&ji=${pnu.slice(15, 19)}&_type=json`;

  setStatus('건축물대장·공시지가·주변시설 조회 중…');
  const [bld, land, near] = await Promise.all([
    getBuilding(B, dong, ho).catch(e => ({ error: e.message })),
    getLand(pnu, dong, ho),
    getNear(x, y)
  ]);
  return { query, dong, ho, pnu, parcelAddr, roadAddr, bld, land, near };
}

// ---------- 건축물대장 ----------
const BR = 'https://apis.data.go.kr/1613000/BldRgstHubService';
async function allItems(url) {
  // 단지형 아파트처럼 100건을 넘는 경우가 많아 페이지를 끝까지 넘긴다
  let all = [];
  for (let p = 1; p <= 20; p++) {
    const j = await getJson(`${url}&numOfRows=100&pageNo=${p}`);
    const body = j.response?.body || {};
    const got = arr(body.items?.item);
    all = all.concat(got);
    if (!got.length || all.length >= +body.totalCount) break;
  }
  return all;
}
async function getBuilding(B, dong, ho) {
  const key = dataKey();
  const [titles, recapJ] = await Promise.all([
    allItems(`${BR}/getBrTitleInfo?serviceKey=${key}&${B}`),
    getJson(`${BR}/getBrRecapTitleInfo?serviceKey=${key}&${B}&numOfRows=5&pageNo=1`).catch(() => null)
  ]);
  const recap = arr(recapJ?.response?.body?.items?.item)[0] || null;
  let title = (dong && titles.find(t => normDong(t.dongNm) === dong))
    || titles.find(t => String(t.mainAtchGbCd) === '0') || titles[0] || {};
  let expos = [];
  if (ho) {
    const eu = `${BR}/getBrExposPubuseAreaInfo?serviceKey=${key}&${B}&hoNm=${enc(ho)}`;
    if (dong) {
      // 대장의 동 표기가 "105동" / "105" 로 갈려서 둘 다 시도
      for (const dn of [dong + '동', dong]) {
        expos = (await allItems(`${eu}&dongNm=${enc(dn)}`)).filter(e => normDong(e.dongNm) === dong);
        if (expos.length) break;
      }
    } else {
      expos = await allItems(eu);
    }
  }
  return { title, recap, expos };
}

// ---------- 브이월드 국가중점데이터 ----------
async function getLand(pnu, dong, ho) {
  let err = '';
  async function ned(op, extra) {
    const u = `https://api.vworld.kr/ned/data/${op}?key=${KEYS.vw}&pnu=${pnu}&format=json&numOfRows=1000&pageNo=1${extra}`;
    // 브이월드가 가끔 정상 키에도 INCORRECT_KEY 를 돌려줘서 몇 번 다시 시도한다
    for (let i = 0; i < 4; i++) {
      try {
        const r = await jsonp(u);
        const root = Object.values(r)[0] || {};
        if (!root.resultCode || root.resultCode === 'OK' || root.resultCode === 'NORMAL_SERVICE') return arr(root.field);
        err = `${root.resultCode} ${root.resultMsg || ''}`;
      } catch (e) { err = e.message; }
      await sleep(1200);
    }
    return [];
  }
  const yr = new Date().getFullYear();
  async function byYear(op, extra, pick) {
    for (const y of [yr, yr - 1]) {
      const rows = pick(await ned(op, `&stdrYear=${y}${extra}`));
      if (rows.length) return rows;
    }
    return [];
  }
  const [landChar, jiga, landUse, apt] = await Promise.all([
    byYear('getLandCharacteristics', '', r => r),
    byYear('getIndvdLandPriceAttr', '', r => r),
    ned('getLandUseAttr', '&cnflcAt='),
    ho ? byYear('getApartHousingPriceAttr', `&hoNm=${enc(ho)}`, r => r.filter(a =>
      String(a.hoNm || '').replace(/호$/, '') === ho && (!dong || normDong(a.dongNm) === dong))) : Promise.resolve([])
  ]);
  return { landChar, jiga, landUse, apt, err };
}

// ---------- 주변 학교·교통 ----------
async function getNear(x, y) {
  async function vwNear(q, re, deg) {
    try {
      const r = await vwSearch(`size=1000&page=1&query=${enc(q)}&type=place&bbox=${x - deg},${y - deg},${x + deg},${y + deg}`);
      if (r.response?.status !== 'OK') return [];
      const seen = new Set();
      return arr(r.response.result.items)
        .filter(it => re.test(it.category))
        .map(it => ({ name: it.title, dist: Math.round(distance(x, y, +it.point.x, +it.point.y)) }))
        .sort((a, b) => a.dist - b.dist)
        .filter(it => !seen.has(it.name) && seen.add(it.name))
        .slice(0, 3);
    } catch (e) { return []; }
  }
  async function vwExpand(q, re) {
    for (const deg of [0.012, 0.03, 0.06]) { const n = await vwNear(q, re, deg); if (n.length) return n; }
    return [];
  }
  // 카카오 키가 있으면 학교·지하철역은 카카오(거리순 정렬, 이름이 깔끔함)로 찾는다
  async function kakaoNear(q, re) {
    let list = [];
    for (let page = 1; page <= 3 && list.length < 3; page++) {
      const u = q === 'SW8'
        ? `https://dapi.kakao.com/v2/local/search/category.json?category_group_code=SW8&x=${x}&y=${y}&radius=5000&sort=distance&size=15&page=${page}`
        : `https://dapi.kakao.com/v2/local/search/keyword.json?query=${enc(q)}&category_group_code=SC4&x=${x}&y=${y}&radius=10000&sort=distance&size=15&page=${page}`;
      let r;
      try { r = await getJson(u, { Authorization: 'KakaoAK ' + KEYS.kakao }); } catch (e) { return null; }
      // 부설 방송통신중·고, 분교 등은 확인설명서 기재 대상이 아니라 뺀다
      list = list.concat(r.documents
        .filter(d => re.test(d.category_name) && !/방송통신|부설|분교/.test(d.place_name))
        .map(d => ({ name: d.place_name, dist: +d.distance })));
      if (r.meta.is_end) break;
    }
    return list.sort((a, b) => a.dist - b.dist).slice(0, 3);
  }
  const k = KEYS.kakao;
  const [elemK, midK, highK, subK, bus] = await Promise.all([
    k ? kakaoNear('초등학교', /> 초등학교/) : null,
    k ? kakaoNear('중학교', /> 중학교/) : null,
    k ? kakaoNear('고등학교', /> 고등학교/) : null,
    k ? kakaoNear('SW8', /지하철/) : null,
    vwNear('정류장', /정류장/, 0.006).then(b => b.length ? b : vwNear('정류장', /정류장/, 0.015))
  ]);
  const [elem, mid, high, subway] = await Promise.all([
    elemK?.length ? elemK : vwExpand('초등학교', /초등학교$/),
    midK?.length ? midK : vwExpand('중학교', /중학교$/),
    highK?.length ? highK : vwExpand('고등학교', /고등학교$/),
    subK?.length ? subK : vwExpand('지하철역', /지하철역/)
  ]);
  return { elem, mid, high, subway, bus };
}

// ---------- 화면 ----------
function render(R) {
  const t = R.bld.title || {}, recap = R.bld.recap, expos = R.bld.expos || [];
  const L = R.land;
  const jeon = expos.filter(e => String(e.exposPubuseGbCd) === '1');
  const gong = expos.filter(e => String(e.exposPubuseGbCd) !== '1');
  const sum = a => a.reduce((s, e) => s + (+e.area || 0), 0);
  const jeonArea = jeon.length ? Math.round(sum(jeon) * 100) / 100 : '';
  const gongArea = gong.length ? Math.round(sum(gong) * 10000) / 10000 : '';
  const unitUse = jeon.length ? ((jeon[0].etcPurps || '').trim() || jeon[0].mainPurpsCdNm) : '';
  // 호 단위 용도가 있으면 그것으로 판단한다 (오피스텔 건물 안의 다세대 호실 등)
  const isOffi = /오피스텔/.test(unitUse || t.etcPurps || '');
  const ua = String(t.useAprDay || '');
  const useAprTxt = ua.length >= 6 ? `${ua.slice(0, 4)}.${+ua.slice(4, 6)}` : '';
  const quake = { '1': '적용', '0': '미적용' }[String(t.rserthqkDsgnApplyYn)] || '';
  // 단지형은 동별 표제부에 대지면적·주차대수가 0이라 총괄표제부 값을 쓴다
  let parking = ['indrAutoUtcnt', 'oudrAutoUtcnt', 'indrMechUtcnt', 'oudrMechUtcnt'].reduce((s, f) => s + (+t[f] || 0), 0);
  if (!parking && recap?.totPkngCnt) parking = +recap.totPkngCnt;
  const platArea = +t.platArea > 0 ? t.platArea : (recap && +recap.platArea > 0 ? recap.platArea : (L.landChar[0]?.lndpclAr || ''));
  const jimok = L.landChar[0]?.lndcgrCodeNm || '';
  const jiga = L.jiga[0], apt = L.apt[0];
  const fmt = n => n ? Number(n).toLocaleString('ko-KR') : '';

  let disp = `${R.parcelAddr} ${t.bldNm || ''}`.trim();
  if (R.dong) disp += ` ${R.dong}동`;
  if (R.ho) disp += ` ${R.ho}호`;

  let h = '';
  const row = (label, value, note = '') => {
    const v = String(value ?? '');
    let cell = v ? `<span class="v">${esc(v)}</span><button type="button" data-v="${esc(v)}">복사</button>` : `<span class="need">직접 확인</span>`;
    if (note) cell += `<div class="note">${note}</div>`;
    h += `<tr><th>${esc(label)}</th><td>${cell}</td></tr>`;
  };
  const sec = title => { h += `<h2>${esc(title)}</h2><table>`; };
  const end = () => { h += '</table>'; };
  const noteRow = html => { h += `<tr><td colspan="2" class="note">${html}</td></tr>`; };
  const nearRow = (label, list, trim) => {
    if (!list?.length) return row(label, '', '주변에서 찾지 못했습니다');
    const f = list[0];
    const mm = f.name.match(trim);
    const name = mm && mm[1] ? mm[1] : f.name.replace(trim, '');
    let note = `직선 ${f.dist}m · ${trip(f.dist)}`;
    if (name !== f.name && f.name !== name + '학교') note = `${esc(f.name)} · ${note}`;
    const others = list.slice(1).map(o => `${esc(o.name)} ${o.dist}m`).join(', ');
    if (others) note += `<br>다른 후보: ${others}`;
    row(label, name, note);
  };
  const link = (url, text) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${text}</a>`;

  if (R.bld.error) h += `<div class="warn">건축물대장 조회 실패: ${esc(R.bld.error)}. 공공데이터포털 인증키를 확인하세요.</div>`;
  const nedMissing = !jiga || !L.landUse.length || !jimok || (R.ho && !isOffi && !apt);
  if (L.err && nedMissing) h += `<div class="warn">브이월드 조회 일부 실패: ${esc(L.err)}. 비어 있는 칸은 잠시 후 다시 조회하거나 링크된 사이트에서 확인하세요.</div>`;

  sec('① 대상물건의 표시');
  row('소재지', disp, roadAddr(R));
  row('토지 면적(㎡)', platArea, '건축물대장 대지면적');
  row('지목', jimok, jimok ? '' : '토지대장 확인');
  row('전용면적(㎡)', jeonArea, R.ho && !jeon.length ? `${esc(R.ho)}호를 대장에서 찾지 못했습니다. 동/호 표기를 확인하세요.` : (gongArea ? `공용면적 합계 ${gongArea} ㎡` : ''));
  row('대지지분', '', '등기부(대지권) 확인');
  row('준공년도', useAprTxt, ua.length === 8 ? `사용승인일 ${ua.slice(0, 4)}-${ua.slice(4, 6)}-${ua.slice(6, 8)}` : '');
  row('건축물대장상 용도', unitUse, t.etcPurps ? `건물 전체: ${esc(t.etcPurps)}` : '');
  row('구조', t.strctCdNm);
  row('방향', '', '현장 확인');
  row('내진설계 적용여부', quake, quake === '미적용' ? '대장에 값이 비어 미적용으로 나오는 경우가 많습니다. 원본 대장 확인' : '');
  row('내진능력', String(t.rserthqkAblty || '').trim());
  row('위반건축물 여부', '', `${link('https://www.gov.kr/mw/AA020InfoCappView.do?HighCtgCD=A01010001&CappBizCD=15000000098', '정부24 건축물대장')}에서 위반 표시 확인`);
  end();

  sec('③ 토지이용계획');
  if (L.landUse.length) {
    // 포함이 아닌 저촉·접합은 이름 뒤에 표시
    const names = [...new Set(L.landUse.filter(u => u.prposAreaDstrcCodeNm).map(u =>
      u.cnflcAtNm && u.cnflcAtNm !== '포함' ? `${u.prposAreaDstrcCodeNm}(${u.cnflcAtNm})` : u.prposAreaDstrcCodeNm))];
    const reArea = /^(제[123]종(전용|일반)주거|준주거|(중심|일반|근린|유통)상업|(전용|일반|준)공업|(보전|생산|자연)녹지|(보전|생산|계획)관리|농림|자연환경보전)지역/;
    const reZone = /^(개발제한|도시자연공원|시가화조정|수산자원보호|입지규제최소)구역/;
    const area = names.filter(n => reArea.test(n));
    const zone = names.filter(n => reZone.test(n));
    const permit = names.filter(n => /토지거래(계약에관한)?허가/.test(n));
    const plan = names.filter(n => /지구단위계획/.test(n));
    const fac = names.filter(n => /로\d류|도로|공원|광장|주차장/.test(n) && !/구역|지역|지구/.test(n));
    const dist = names.filter(n => /지구(\(|$)/.test(n) && !/지구단위/.test(n));
    const used = new Set([...area, ...zone, ...permit, ...plan, ...fac, ...dist]);
    const etc = names.filter(n => !used.has(n));
    row('용도지역', area.join(', '));
    row('용도지구', dist.join(', '), dist.length ? '' : '조회 결과 없음 (해당없음 가능)');
    row('용도구역', zone.join(', '), zone.length ? '' : '조회 결과 없음 (해당없음 가능)');
    row('도시·군계획시설', fac.join(', '));
    row('허가·신고 구역', permit.length ? '토지거래허가구역' : '', permit.length ? '' : '조회 결과 없음');
    row('지구단위계획구역', plan.length ? '지구단위계획구역' : '', plan.length ? '' : '조회 결과 없음');
    row('그 밖의 이용제한', etc.join(', '));
    noteRow('투기지역·투기과열지구 여부는 이 자료에 없습니다. 국토교통부 고시로 확인하세요.');
  } else {
    row('용도지역·지구·구역', '', `조회하지 못했습니다. ${link('https://www.eum.go.kr/', '토지이음')}에서 확인`);
  }
  end();

  const N = R.near;
  sec('⑤ 입지조건');
  nearRow('버스 정류장', N.bus, /\(?(?:버스)?정류장\)?$/);
  nearRow('지하철역', N.subway, /^(.*?\S)역(\s.*|\d+번출입구)?$/);
  nearRow('초등학교', N.elem, /학교$/);
  nearRow('중학교', N.mid, /학교$/);
  nearRow('고등학교', N.high, /학교$/);
  row('주차대수(대장)', parking ? `${parking}대` : '', '전용/공동 여부는 현장 확인');
  noteRow(`거리는 직선거리 기준 근사치입니다. 초등학교는 가장 가까운 곳과 배정학교가 다를 수 있으니 ${link('https://schoolzone.emac.kr/', '학구도안내서비스')}에서 확인하세요.`);
  end();

  sec('⑧ 거래예정금액 등 (임대차는 생략 가능)');
  const priceLink = link('https://www.realtyprice.kr/', '부동산공시가격알리미');
  row('개별공시지가(원/㎡)', fmt(jiga?.pblntfPclnd), jiga ? `${jiga.stdrYear}년 기준` : `${priceLink}에서 확인`);
  if (isOffi) {
    row('건물 기준시가(오피스텔)', '', `국세청 고시라 자동 조회 불가. ${link('https://hometax.go.kr/', '홈택스')} → 조회/발급 → 기준시가 조회 → 오피스텔`);
  } else if (R.ho) {
    row('공동주택가격(원)', fmt(apt?.pblntfPc), apt ? `${apt.stdrYear}년 기준` : `${priceLink}에서 확인`);
  }
  end();

  const now = new Date();
  const stamp = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  $('out').innerHTML = `<div class="card"><p class="title">${esc(disp)}</p><div class="sub">조회일 ${stamp} · 지번코드 ${R.pnu} · 출처: 국토교통부 건축물대장, 브이월드${KEYS.kakao ? ', 카카오' : ''}</div></div>`
    + h + '<p class="note">공적자료 자동조회 결과입니다. 확인설명서 작성 전 원본 공부와 대조하세요.</p>';
}
function roadAddr(R) { return R.roadAddr ? `도로명: ${esc(R.roadAddr)}` : ''; }

// 복사 버튼
$('out').addEventListener('click', e => {
  const b = e.target.closest('button[data-v]');
  if (!b) return;
  const v = b.getAttribute('data-v');
  const done = () => { const t = b.textContent; b.textContent = '복사됨'; setTimeout(() => { b.textContent = t; }, 1200); };
  const fallback = () => {
    const a = document.createElement('textarea');
    a.value = v; document.body.appendChild(a); a.select();
    try { document.execCommand('copy'); } catch (err) {}
    a.remove(); done();
  };
  if (navigator.clipboard) navigator.clipboard.writeText(v).then(done, fallback); else fallback();
});

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  if (!KEYS.data || !KEYS.vw) { $('keys').hidden = false; setStatus('먼저 인증키를 저장하세요.'); return; }
  const btn = e.submitter || $('f').querySelector('button');
  btn.disabled = true;
  $('out').innerHTML = '';
  try {
    const R = await lookup($('addr').value.trim(), $('dong').value.trim(), $('ho').value.trim());
    render(R);
    setStatus('');
  } catch (err) {
    setStatus('조회 실패: ' + err.message);
  } finally {
    btn.disabled = false;
  }
});

loadKeys();
</script>
</body>
</html>
